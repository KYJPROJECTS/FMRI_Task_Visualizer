<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigación — FMRI Assistant</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="nav-brand">
        <img src="assets/logo.png" alt="Logo de FMRI Assistant" class="nav-logo">
        FMRI ASSISTANT
      </a>
      <a href="nueva-sesion.html" class="nav-link">Nueva sesión</a>
      <a href="investigacion.html" class="nav-link active">Investigación</a>
    </div>
  </nav>

  <section class="view">
    <div class="session-layout">

      <!-- Panel izquierdo: escenario donde se muestran las imágenes -->
      <div class="panel player-panel">

        <div class="now-playing" id="now-playing-inv" hidden>
          <strong id="current-instance-name-inv">—</strong>
          <span id="progress-label-inv"></span>
        </div>

        <div class="player-section" id="stage-container">
          <img id="stage-image" class="stage-image" alt="Imagen de estímulo" hidden>

          <div class="rest-screen" id="rest-screen-inv" hidden>
            <button id="btn-continue-next-inv" class="btn-rest-next">Siguiente tarea</button>
          </div>

          <div class="custom-controls" id="custom-controls">
            <div class="progress-bar-container" id="progress-bar-container">
              <div class="progress-bar-filled" id="progress-bar-filled"></div>
            </div>
            <div class="controls-buttons">
              <button id="btn-play-pause-inv" class="control-btn" disabled title="Reproducir/Pausar">▶</button>
              <button id="btn-reset-inv" class="control-btn" disabled title="Reiniciar">⟲</button>
              <button id="btn-skip-step-inv" class="control-btn" disabled title="Terminar este paso ahora">⏭</button>
              <button id="btn-extend-step-inv" class="control-btn" disabled title="Extender este paso 5s">+5s</button>
              <button id="btn-fullscreen-inv" class="control-btn" disabled title="Pantalla completa">⛶</button>
            </div>
          </div>
        </div>

      </div>

      <!-- Panel derecho: constructor de instancias + secuencia -->
      <div class="panel builder-panel">
        <h3>Configurar tarea</h3>

        <div class="tasks-dropdown">
          <label for="task-select-inv" class="hint">Tarea base</label>
          <select id="task-select-inv">
            <option value="" disabled selected>-- Elige una tarea --</option>
          </select>
        </div>

        <div class="params-grid" id="params-grid">
          <div class="tasks-dropdown">
            <label for="num-blocks-input" class="hint">Número de bloques (mín. 6)</label>
            <input type="number" id="num-blocks-input" step="2" min="6" disabled>
            <p class="hint" id="num-blocks-hint"></p>
          </div>
          <div class="tasks-dropdown">
            <label for="block-duration-input" class="hint">Duración de cada bloque (segundos)</label>
            <input type="number" id="block-duration-input" step="0.5" disabled>
          </div>
          <div class="tasks-dropdown">
            <label for="stimuli-per-block-input" class="hint">Estímulos por bloque</label>
            <input type="number" id="stimuli-per-block-input" step="1" min="1" disabled>
            <p class="hint" id="stimuli-per-block-hint"></p>
          </div>
        </div>

        <ul class="task-list" id="preview-stats-list">
          <li><span class="task-title">Tiempo por estímulo</span><span id="stat-stimulus-time"
              class="task-duration">—</span></li>
          <li><span class="task-title">Tiempo total de esta tarea</span><span id="stat-task-total-time"
              class="task-duration">—</span></li>
        </ul>

        <button id="btn-add-instance" class="btn-primary" disabled>Agregar a la secuencia</button>

        <h3>Secuencia de la sesión</h3>
        <p class="sequence-total" id="sequence-total-duration-inv"></p>
        <ol id="sequence-list-inv" class="sequence-list"></ol>
        <p id="sequence-empty-hint-inv" class="hint">Configura una tarea arriba y agrégala para armar la secuencia.</p>
      </div>

    </div>
  </section>

  <script src="js/investigacion.js"></script>
</body>

</html>
