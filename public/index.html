<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Tareas fMRI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>Visualizador de Tareas fMRI</h1>
    <span id="version-tag" class="version-tag">v0.0.0</span>
  </header>

  <main class="app-main">

    <section class="task-selector">
      <label for="task-select">Selecciona la tarea:</label>
      <select id="task-select">
        <option value="" disabled selected>-- Elige una tarea --</option>
        <option value="demo1">Tarea de prueba 1</option>
        <option value="demo2">Tarea de prueba 2</option>
        <option value="demo3">Tarea de prueba 3</option>
      </select>
    </section>

    <section class="player-wrapper">
      <div class="player-section" id="player-container">
        <div id="youtube-player"></div>

        <!-- Capa transparente: intercepta el mouse antes de que llegue al iframe de YouTube.
             Esto evita que aparezcan los íconos de compartir, "ver más tarde", etc. -->
        <div class="video-overlay" id="video-overlay"></div>

        <!-- Nuestra barra de controles personalizada -->
        <div class="custom-controls" id="custom-controls">
          <div class="progress-bar-container" id="progress-bar-container">
            <div class="progress-bar-filled" id="progress-bar-filled"></div>
          </div>
          <div class="controls-buttons">
            <button id="btn-play-pause" class="control-btn" disabled title="Reproducir/Pausar">▶</button>
            <button id="btn-rewind" class="control-btn" disabled title="Retroceder 10s">⏪ 10s</button>
            <button id="btn-restart" class="control-btn" disabled title="Reiniciar">⏮</button>
            <button id="btn-fullscreen" class="control-btn" disabled title="Pantalla completa">⛶</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>FMRI tasks</p>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/script.js"></script>
</body>
</html>
